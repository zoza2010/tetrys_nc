[project]
name = "tetrys-nc"
version = "0.1.0"
description = "Tetrys on-the-fly network coding transport over UDP (RFC 9407)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
gen = ["raptorq>=2"]

[project.scripts]
tetrys-server = "tetrys_nc.server:main"
tetrys-client = "tetrys_nc.client:main"
tetrys-genfile = "tetrys_nc.genfile:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[dependency-groups]
dev = ["pytest>=8.0"]
