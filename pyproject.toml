[project]
name = "tetrys-nc"
version = "0.1.0"
description = "Generation RaptorQ UDP file transfer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "raptorq>=2",
    "textual>=0.80",
]

[project.scripts]
tetrys-server = "tetrys_nc.server:main"
tetrys-client = "tetrys_nc.client:main"
tetrys-fm = "tetrys_nc.fm_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
